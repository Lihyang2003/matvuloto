<script>
  // preload images, then start
  const pre = ['assets/img/world.jpg','assets/img/bg_kitchen.jpg','assets/img/pouch.webp','assets/img/coin.webp', ...CHARS.map(c => charImg(c[0]))];
  pre.forEach(src => { const i = new Image(); i.src = src; });
  const start = (location.hash || '').slice(1);
  document.fonts.ready.finally(() => go(SCREENS[start] && ['lobby','character','shop','shopxu','leaderboard','quests','profile','friends','mail','settings','create','join','find'].includes(start) && S.logged ? start : 'splash', {}, { push: false }));
</script>
