<script>
  // preload images, then start
  const pre = ['assets/img/logo.webp','assets/img/collision.png','assets/img/ticket_frame.svg','assets/img/world.jpg','assets/img/world_small.jpg','assets/img/bg_kitchen.jpg','assets/img/pouch.webp','assets/img/pouch_open.webp','assets/img/coin.webp','assets/img/li_xi.webp', ...CHARS.map(c => charImg(c[0]))];
  window.PRE = { n: 0, total: pre.length };
  pre.forEach(src => { const i = new Image(); i.onload = i.onerror = () => PRE.n++; i.src = src; });
  const start = (location.hash || '').slice(1);
  document.fonts.ready.finally(() => go(SCREENS[start] && ['lobby','character','shop','shopxu','leaderboard','quests','profile','friends','mail','settings','create','join','find'].includes(start) && S.logged ? start : 'splash', {}, { push: false }));
</script>
